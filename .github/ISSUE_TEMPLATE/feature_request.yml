name: Feature request
description: Propose a bounded, evidence-backed improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What observed limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance test
      description: Explain how the change can be verified and bounded.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Scope
      options:
        - Shared contract
        - Claude Code
        - Cursor
        - Codex
        - Qwen Code
        - Documentation/release
    validations:
      required: true
